<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooftop Farming Contact Support</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NFM3LHRRQR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NFM3LHRRQR');
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #eef4f1; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .card { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 420px; width: 100%; overflow: hidden; text-align: center; }
    
    /* Hero Banner Image */
    .banner { width: 100%; height: 140px; object-fit: cover; }
    
    /* Logo Styling */
    .logo-container { margin-top: -40px; margin-bottom: 12px; }
    .logo { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #ffffff; background: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); object-fit: cover; }
    
    .content { padding: 0 24px 28px 24px; }
    h2 { color: #1b3b2b; font-size: 22px; margin-bottom: 6px; }
    p { color: #5a6e63; font-size: 14px; margin-bottom: 22px; line-height: 1.4; }
    
    /* Buttons */
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 16px; margin-bottom: 12px; border: none; border-radius: 12px; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    
    .btn-inquiry { background-color: #25D366; }
    .btn-subsidy { background-color: #128c7e; }
    .btn-plant { background-color: #075e54; }
    
    .btn-icon { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header Banner Image -->
    <img class="banner" src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=800&q=80" alt="Plant banner">

    <!-- Logo Overlay -->
    <div class="logo-container">
      <img class="logo" src="https://images.unsplash.com/photo-1545241047-6083a3684587?auto=format&fit=crop&w=200&q=80" alt="Company Logo">
    </div>

    <div class="content">
      <h2>GreenCare Support</h2>
      <p>How can we assist you today? Tap an option below to open WhatsApp.</p>

      <!-- General Inquiry -->
      <button class="btn btn-inquiry" onclick="trackAndRedirect('General Inquiry', '917300209577', 'Hi, I have a general inquiry regarding your services.')">
        💬 General Inquiry
      </button>

      <!-- Subsidy Beneficiary -->
      <button class="btn btn-subsidy" onclick="trackAndRedirect('Subsidy Beneficiary', '917300209577', 'Hello, I am a subsidy beneficiary and need assistance.')">
        📋 Subsidy Beneficiary
      </button>

      <!-- Plant Care Support -->
      <button class="btn btn-plant" onclick="trackAndRedirect('Plant Care Support', '917 ', 'Hi, I need support regarding plant care.')">
        🌿 Plant Care Support
      </button>
    </div>
  </div>

  <script>
    function trackAndRedirect(department, phone, text) {
      if (typeof gtag === 'function') {
        gtag('event', 'whatsapp_department_click', { 'department_name': department });
      }
      setTimeout(function() {
        window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
      }, 150);
    }
  </script>

</body>
</html>
